spring.application.name=Phegon-Eccormerce
server.port=9800
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
secreteJwtString=your_secret_jwt_string

# AWS S3 Configuration
 aws.s3.access=your_aws_s3_access_key
 aws.s3.secrete=your_aws_s3_secret_key
 aws.s3.bucket-name=phegon-ecommerce
 aws.s3.region=ap-southeast-1
